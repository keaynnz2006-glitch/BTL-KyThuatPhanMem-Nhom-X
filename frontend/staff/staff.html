<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhân Viên - Duyệt Phiếu Đổi Quà</title>
    <link rel="stylesheet" href="staff.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🛠️ HỆ THỐNG NHÂN VIÊN DUYỆT QUÀ</h2>
        <button class="btn-logout" onclick="handleLogout()">Đăng xuất</button>
    </div>

    <h3>Danh sách phiếu đổi quà của khách hàng</h3>
    <table>
        <thead>
            <tr>
                <th>Mã Phiếu</th>
                <th>Mã Khách Hàng</th>
                <th>Số Điểm Tiêu Tiêu Hao</th>
                <th>Thời Gian Đổi</th>
                <th>Nhân Viên Duyệt</th>
                <th>Hành Động</th>
            </tr>
        </thead>
        <tbody id="ticket-list">
            <tr><td colspan="6">Đang tải danh sách phiếu...</td></tr>
        </tbody>
    </table>
</div>

<script src="staff.js"></script>
</body>
</html>
