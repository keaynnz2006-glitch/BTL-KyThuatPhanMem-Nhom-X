<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Cửa Hàng Gacha Gấu Hoàng Gia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo"> Cửa Hàng Gacha Gấu </div>
        <div class="user-info">
            <span id="user-display" style="font-weight: 600;">Xin chào, Bro!</span>
            <div id="coin-balance" class="coin-badge">💰 0 Xu</div>
            <a href="history.html" class="btn-history">📜 Lịch sử & Đổi quà</a>
            <button class="btn-logout" onclick="logout()">Đăng xuất</button>
        </div>
    </nav>

    <div class="container">
        
        <div class="recharge-section">
            <h3>💸 Nạp Tiền Đổi Xu (Tự động tính KM Ngày lễ/Cuối tuần)</h3>
            
            <div class="field-title">Chọn số tiền muốn nạp:</div>
            <div class="amount-presets">
                <button type="button" class="preset-btn" onclick="selectPreset(20000, this)">20.000đ</button>
                <button type="button" class="preset-btn active" onclick="selectPreset(50000, this)">50.000đ</button>
                <button type="button" class="preset-btn" onclick="selectPreset(100000, this)">100.000đ</button>
                <button type="button" class="preset-btn" onclick="selectPreset(200000, this)">200.000đ</button>
            </div>

            <div class="custom-amount-box">
                <input type="number" id="recharge-amount" value="50000" placeholder="Hoặc nhập số tiền khác (VND)" min="1000" oninput="clearPresets()">
            </div>

            <div class="field-title">Chọn phương thức thanh toán:</div>
            <div class="payment-methods">
                <div class="method-card active" onclick="selectPayment('momo', this)">
                    <img src="../assets/momo.png" alt="MoMo"> Ví MoMo
                </div>
                <div class="method-card" onclick="selectPayment('zalopay', this)">
                    <img src="../assets/zalopay.jpg" alt="ZaloPay" style="background:#0084ff;"> ZaloPay
                </div>
                <div class="method-card" onclick="selectPayment('vnpay', this)">
                    <img src="../assets/vnpay.webp" alt="VNPAY" style="background: #f1f2f6; object-fit: contain;"> VNPAY QR
                </div>
            </div>

            <button type="button" class="btn-recharge-submit" onclick="handleRechargeNew()">Xác Nhận Thanh Toán</button>
        </div>

        <h2 class="section-title"> Danh Sách Máy Gacha Hiện Tại</h2>
        <div class="machine-grid" id="machine-grid">
    </div>
    <script src="app.js"></script>
    
</body>
</html>
